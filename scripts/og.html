<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 0 96px;
    display: flex; align-items: center; gap: 72px;
    background: #FBF7F0; color: #1E2433;
    font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif;
  }
  .hero { width: 400px; height: 400px; flex: none; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  .brand img { width: 52px; height: 52px; }
  h1 { margin: 28px 0 22px; font-size: 64px; line-height: 1.22; font-weight: 900; letter-spacing: -0.035em; }
  p { margin: 0; font-size: 28px; color: #5B6475; font-weight: 600; }
</style>
</head>
<body>
  <img class="hero" src="../public/images/hero.svg" alt="">
  <div>
    <div class="brand"><img src="../public/icon.svg" alt="">함께 퍼즐</div>
    <h1>모둠이 함께 맞추는<br>교실 직소 퍼즐</h1>
    <p>코드 하나로 입장 · 학생 로그인 없음 · 광고 없음</p>
  </div>
</body>
</html>
