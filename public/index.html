  <header class="home-top">
    <p class="brand"><img class="ic" src="/icon.svg" alt="" width="26" height="26">조각조각</p>
    <a class="home-top-teacher" href="/teacher">선생님 · 수업 만들기</a>
  </header>
  <section class="home-hero" aria-labelledby="home-title">
    <div class="home-art" aria-hidden="true">
      <img class="hero" src="/images/hero.svg" alt="" width="170" height="170">
      <svg class="float f1"><use href="#piece"/></svg>
      <svg class="float f2"><use href="#piece"/></svg>
      <svg class="float f3"><use href="#piece"/></svg>
      <svg class="float f4"><use href="#piece"/></svg>
      <svg class="float f5"><use href="#piece"/></svg>
    </div>
    <div class="home-main">
      <p class="home-eyebrow">모둠이 함께 맞추는 교실 퍼즐</p>
      <h1 id="home-title">선생님이 알려 준<br>코드를 넣어요</h1>
      <form class="code-form" action="/join" method="get">
        <div class="code-field">
          <label class="sr-only" for="code">수업 코드 6자리</label>
          <input class="code-input" id="code" name="code" type="text" inputmode="numeric" autocomplete="off"
            enterkeyhint="go" pattern="[0-9]{6}" maxlength="12" title="숫자 6자리" required>
          <div class="code-cells" aria-hidden="true"><span></span><span></span><span></span><i></i><span></span><span></span><span></span></div>
        </div>
        <button class="btn pri big" type="submit">들어가기</button>
      </form>
      <p class="hint">QR 코드를 찍으면 코드를 넣지 않아도 돼요</p>
    </div>
  </section>
  <ol class="home-steps" aria-label="이렇게 해요">
    <li><svg aria-hidden="true"><use href="#piece"/></svg><b>코드 넣기</b><span>선생님이 알려 준 숫자 6개</span></li>
    <li><svg aria-hidden="true"><use href="#piece"/></svg><b>이름 쓰기</b><span>로그인은 필요 없어요</span></li>
    <li><svg aria-hidden="true"><use href="#piece"/></svg><b>함께 맞추기</b><span>내 조각을 꺼내 모둠 친구들과</span></li>
  </ol>
  <section class="practice" id="practice" aria-labelledby="practice-title" hidden>
    <div class="practice-head">
      <div>
        <h2 id="practice-title">혼자 맞춰 보기</h2>
        <p class="practice-sub">코드가 없어도 그림을 골라 연습할 수 있어요</p>
      </div>
      <div class="practice-pieces" role="group" aria-label="조각 수">
        <button type="button" data-pieces="12" aria-pressed="true">12조각</button>
        <button type="button" data-pieces="24" aria-pressed="false">24조각</button>
        <button type="button" data-pieces="48" aria-pressed="false">48조각</button>
      </div>
    </div>
    <div class="practice-themes" role="group" aria-label="주제"></div>
    <ul class="practice-list"></ul>
    <button class="btn practice-more" type="button">다른 그림 보기</button>
  </section>
  <div class="spacer"></div>
  <div class="home-foot">
    <p class="teacher-link">선생님이신가요? <a href="/teacher">수업 만들기 →</a></p>
    <a class="policy-link" href="/privacy">개인정보 처리방침</a>
