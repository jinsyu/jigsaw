# /etc/systemd/journald.conf.d/zz-retention.conf, installed by scripts/rt/setup.sh. It applies
# to the whole journal, so to every app on the rt server. Drop-ins apply in file name order and
# Ubuntu's /usr/lib/systemd/journald.conf.d/syslog.conf sets ForwardToSyslog=yes, so this name
# must sort after "syslog.conf".
# Server logs are kept 14 days (spec data table, privacy policy). Files rotate daily so old
# entries leave on time, and nothing is copied to /var/log/syslog (kept longer by logrotate).
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
