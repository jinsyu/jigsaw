<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  body { width: 1920px; height: 1080px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .appbar { height: 76px; }
  .appbar .mid { display: flex; gap: 10px; align-items: center; }
  .timer { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .appbar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .sum { display: flex; gap: 14px; padding: 22px 36px 0; align-items: center; }
  .sum .pill { font-size: 17px; padding: 8px 16px; }
  .sum .pill b { color: var(--ink); }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 20px; padding: 18px 36px 30px; min-height: 0; }
  .g { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .gh { display: flex; align-items: center; gap: 12px; }
  .gh b { font-size: 24px; font-weight: 800; }
  .gh .prog { flex: 1; height: 10px; }
  .gh .pct { font-size: 20px; font-weight: 800; color: var(--ok); min-width: 56px; text-align: right; }
  .gh .zoom { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  .mini { flex: 1; border-radius: 14px; min-height: 0; }
  .g.done { box-shadow: inset 0 0 0 3px var(--ok); }
  .g.done .mini { background: #EAF6EE; background-image: none; }
  .badge { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ok); color: #fff; font-weight: 800; font-size: 18px; padding: 8px 18px; border-radius: 999px; white-space: nowrap; }
  .mates { display: flex; gap: 6px; flex-wrap: wrap; }
  .mates .chip { height: 32px; font-size: 15px; }
</style>
</head>
<body>
<div class="appbar">
  <div class="brand"><span class="ic" data-icon="#3F5BD9"></span>함께 퍼즐</div>
  <div class="mid"><span class="pill">바다 친구들 · 24조각</span><span class="pill pri">코드 482 913</span></div>
  <div class="right">
    <span class="timer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 3h6"/></svg>12:34</span>
    <button class="btn">모둠 편성</button>
    <button class="btn danger">수업 끝내기</button>
  </div>
</div>
<div class="sum">
  <span class="pill ok">완성 <b>&nbsp;1</b>&nbsp;/ 6모둠</span>
  <span class="pill">평균 진행률 <b>&nbsp;57%</b></span>
  <span style="color:var(--muted);font-size:15px;margin-left:6px">모둠을 누르면 크게 볼 수 있어요 · 3초마다 새로 고침</span>
</div>
<div class="grid" id="grid"></div>
<script>
  M.injectScenes();
  document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = M.iconPiece(el.dataset.icon));
  const pz = M.makePuzzle(6, 4, 42);
  // 판 1200x800 위 상태. [c0,c1,r0,r1,X,Y] 덩어리 + 흩어진 조각 수
  function state(cl, nLoose, seed) {
    const r = M.rng(seed), items = [], used = new Set(), boxes = [];
    for (const [c0, c1, r0, r1, X, Y] of cl) {
      M.cluster(pz, c0, c1, r0, r1, X, Y).forEach(o => { items.push(o); used.add(o.i); });
      boxes.push([X - 40, Y - 40, X + (c1 - c0 + 1) * 100 + 40, Y + (r1 - r0 + 1) * 100 + 40]);
    }
    const rest = pz.pieces.filter(p => !used.has(p.i)).sort(() => r() - 0.5).slice(0, nLoose);
    for (const p of rest) {
      for (let t = 0; t < 200; t++) {
        const x = 40 + r() * 1040, y = 40 + r() * 640;
        const b = [x - 30, y - 30, x + 130, y + 130];
        if (boxes.some(q => b[0] < q[2] && b[2] > q[0] && b[1] < q[3] && b[3] > q[1])) continue;
        boxes.push(b); items.push({ i: p.i, x, y }); break;
      }
    }
    return items;
  }
  const names = [['민준', '서연', '지호', '유나'], ['하은', '도윤', '서준', '지우', '소율'], ['예준', '수아', '시우', '연우'], ['하린', '주원', '지아', '은우'], ['채원', '건우', '윤서', '정우'], ['현우', '다은', '선우', '예린']];
  const G = [
    { pct: 63, items: state([[0, 4, 0, 2, 300, 200]], 5, 1) },
    { pct: 38, items: state([[0, 2, 1, 3, 420, 260]], 7, 2), off: 1 },
    { pct: 100, done: '9분 12초' },
    { pct: 17, items: state([[2, 3, 1, 2, 520, 300]], 9, 4) },
    { pct: 50, items: state([[0, 3, 0, 2, 380, 180]], 6, 5) },
    { pct: 75, items: state([[0, 5, 0, 2, 300, 220]], 4, 6) },
  ];
  const all = pz.pieces.map(p => ({ i: p.i, x: p.x0 + 300, y: p.y0 + 170 }));
  document.getElementById('grid').innerHTML = G.map((g, k) => `
    <div class="card g${g.done ? ' done' : ''}">
      <div class="gh"><b>${k + 1}모둠</b><span class="prog"><i style="width:${g.pct}%"></i></span><span class="pct">${g.done ? '완성' : g.pct + '%'}</span>
        <span class="zoom"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span></div>
      <div class="board mini"><svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">${M.piecesSVG(pz, 'sea', g.done ? all : g.items, { unit: 2.4, shadow: !g.done, seam: g.done ? 'rgba(30,25,20,.12)' : undefined })}</svg>${g.done ? `<span class="badge">완성 · ${g.done}</span>` : ''}</div>
      <div class="mates">${names[k].map((n, j) => g.off && j === 1 ? `<span class="chip off"><span class="ic">${M.iconPiece(M.MC[j])}</span>${n}<em>끊김 0:42</em></span>` : `<span class="chip"><span class="ic">${M.iconPiece(M.MC[j])}</span>${n}</span>`).join('')}</div>
    </div>`).join('');
</script>
</body>
</html>
