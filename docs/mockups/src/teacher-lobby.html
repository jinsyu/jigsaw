<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  body { width: 1920px; height: 1080px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .appbar { height: 76px; }
  .appbar .right { margin-left: auto; display: flex; gap: 10px; }
  .main { flex: 1; display: grid; grid-template-columns: 560px 1fr; gap: 28px; padding: 28px 36px; min-height: 0; }
  .join { padding: 34px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .join .k { font-size: 20px; color: var(--sub); font-weight: 600; }
  .join .url { font-size: 30px; font-weight: 800; margin: 6px 0 22px; letter-spacing: -0.01em; }
  .join .code { font-size: 112px; font-weight: 900; letter-spacing: 0.04em; line-height: 1; }
  .join .qr { width: 300px; height: 300px; margin: 30px 0 22px; border-radius: 18px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .join .cnt { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .join .cnt .dot { width: 12px; height: 12px; }
  .right-col { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .head { display: flex; align-items: center; gap: 16px; }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .head p { color: var(--sub); font-size: 18px; }
  .head .btns { margin-left: auto; display: flex; gap: 12px; }
  .head .btn { height: 56px; font-size: 18px; padding: 0 24px; border-radius: 16px; }
  .pool { padding: 18px 22px; }
  .pool b { font-size: 18px; margin-right: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .chips .chip { height: 44px; font-size: 19px; padding: 0 16px 0 10px; }
  .chips .chip .ic { width: 26px; height: 26px; }
  .groups { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 18px; flex: 1; min-height: 0; }
  .g { padding: 18px 20px; display: flex; flex-direction: column; }
  .g .gh { display: flex; justify-content: space-between; align-items: baseline; }
  .g .gh b { font-size: 22px; font-weight: 800; }
  .g .gh span { color: var(--muted); font-size: 17px; font-weight: 600; }
  .slot { height: 44px; border-radius: 999px; border: 2px dashed #D8D0C2; color: var(--muted); font-size: 16px; display: inline-flex; align-items: center; padding: 0 18px; }
  .g.drop { box-shadow: inset 0 0 0 3px var(--pri); background: #F7F8FF; }
  .g.drop .slot { border-color: var(--pri); color: var(--pri); background: #fff; }
  .ghost { position: absolute; left: 1640px; top: 470px; transform: rotate(-4deg); box-shadow: 0 14px 30px rgba(20, 30, 60, .25), inset 0 0 0 2px var(--pri) !important; }
  .hand { position: absolute; left: 1712px; top: 498px; width: 44px; height: 44px; }
</style>
</head>
<body>
<div class="appbar">
  <div class="brand"><span class="ic" data-icon="#3F5BD9"></span>함께 퍼즐</div>
  <span class="pill">바다 친구들 · 24조각 · 6모둠</span>
  <div class="right"><button class="btn">수업 닫기</button></div>
</div>
<div class="main">
  <div class="card join">
    <p class="k">태블릿에서 이 주소를 열고 코드를 넣어요</p>
    <p class="url">jigsaw.gyosil.app</p>
    <p class="code">482 913</p>
    <div class="qr" id="qr"></div>
    <p class="cnt"><i class="dot"></i>들어온 학생 25명</p>
  </div>
  <div class="right-col">
    <div class="head">
      <div><h2>모둠 편성</h2><p>이름을 모둠 칸으로 끌어 놓거나, 무작위로 나눠요.</p></div>
      <div class="btns">
        <button class="btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>무작위로 나누기</button>
        <button class="btn pri" style="padding:0 34px">시작하기</button>
      </div>
    </div>
    <div class="card pool"><b>아직 모둠이 없는 학생</b><span style="color:var(--muted);font-weight:600">3명</span><div class="chips" id="pool"></div></div>
    <div class="groups" id="groups"></div>
  </div>
</div>
<span class="chip ghost" id="ghost"></span>
<svg class="hand" viewBox="0 0 24 24" fill="#fff" stroke="#1E2433" stroke-width="1.5" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5-1.5a1.5 1.5 0 0 1 3 0V10a1.5 1.5 0 0 1 3 0v1a1.5 1.5 0 0 1 3 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4.6 15a1.6 1.6 0 0 1 2.5-2L9 15z"/></svg>
<script>
  M.injectScenes();
  document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = M.iconPiece(el.dataset.icon));
  document.getElementById('qr').innerHTML = M.qrSVG(482913);
  const chip = (n, c) => `<span class="chip"><span class="ic">${M.iconPiece(c)}</span>${n}</span>`;
  const neutral = '#B4AC9E';
  document.getElementById('pool').innerHTML = ['소율', '연우', '정우'].map(n => chip(n, neutral)).join('');
  const G = [['민준', '서연', '지호', '유나'], ['하은', '도윤', '서준', '지우'], ['예준', '수아', '시우'], ['하린', '주원', '지아', '은우'], ['채원', '건우', '윤서'], ['현우', '다은', '선우', '예린']];
  document.getElementById('groups').innerHTML = G.map((ns, gi) => {
    const slots = Math.max(0, 5 - ns.length);
    return `<div class="card g${gi === 2 ? ' drop' : ''}"><div class="gh"><b>${gi + 1}모둠</b><span>${ns.length}명</span></div>
      <div class="chips">${ns.map((n, k) => chip(n, M.MC[k])).join('')}${slots ? `<span class="slot">${gi === 2 ? '여기에 놓기' : '여기로 끌어 놓기'}</span>` : ''}</div></div>`;
  }).join('');
  document.getElementById('ghost').innerHTML = `<span class="ic">${M.iconPiece(neutral)}</span>소율`;
  document.getElementById('ghost').style.cssText += 'height:44px;font-size:19px;padding:0 16px 0 10px';
  document.querySelector('#ghost .ic').style.cssText = 'width:26px;height:26px';
  document.querySelector('#pool .chip').style.opacity = '.35';
</script>
</body>
</html>
